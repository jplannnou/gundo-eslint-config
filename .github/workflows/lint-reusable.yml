# Reusable lint workflow (RATCHET) para todo el fleet GUNDO.
#
# Por qué ratchet: varios repos tienen deuda de lint preexistente (ej. genie-api
# ~172 errores en main). Un gate full nacería rojo y se ignoraría. Esto lintea
# SOLO los archivos tocados por el PR → bloquea errores NUEVOS sin exigir el
# burn-down primero. Cuando un repo termine su burn-down, cambia `ratchet: false`
# para lintear el repo entero.
#
# El ratchet es incremental POR DEFINICIÓN: mide los archivos tocados contra una
# base. En `pull_request` esa base existe y es obvia (`github.base_ref`). En un
# `push` a main no la hay — el push ya ES la nueva verdad de la rama, así que no
# hay contra qué "no empeorar". Por eso el step del ratchet nació atado a
# `pull_request`: sin ese `if` reventaba al resolver `origin/` a secas.
#
# El agujero: no existía la otra rama del `if`. Con el default `ratchet: true`,
# en push a main los DOS steps se saltaban, el job no linteaba nada y pasaba
# verde. El estado de lint de main no significaba nada en todo el fleet, y en los
# repos donde este workflow es el ÚNICO check (product-pipeline) main llevaba
# meses sin verificarse.
#
# Arreglo: el MODO lo decide el evento, no sólo el input.
#   - pull_request → ratchet incremental (si `ratchet: true`): bloquea errores
#     nuevos sin exigir el burn-down previo. Es el gate de merge.
#   - push (y cualquier otro evento) → lint COMPLETO, siempre. En una rama ya
#     mergeada lo único que se puede afirmar es el estado absoluto, que es justo
#     lo que un ratchet nunca puede decir. Es señal post-merge, no gate de merge.
#
# Uso desde un repo consumidor (.github/workflows/ci.yml):
#   jobs:
#     lint:
#       uses: jplannnou/gundo-eslint-config/.github/workflows/lint-reusable.yml@main
#       secrets: inherit
name: Lint (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Label del runner del job. Default ubuntu-latest (GitHub-hosted);
          los repos del org pasan `gundo-local` y los privados personales
          `jp-local` (self-hosted).
        type: string
        default: "ubuntu-latest"
      ratchet:
        description: >-
          Lintear sólo archivos cambiados (true) o el repo entero (false).
          SÓLO aplica en `pull_request`: fuera de un PR no hay base contra la
          que medir, así que el lint es completo pase lo que pase aquí.
        type: boolean
        default: true
      globs:
        description: "Extensiones a lintear (regex para grep -E)"
        type: string
        default: '\.(ts|tsx|js|jsx)$'
      node-version:
        type: string
        default: "22"

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm sin versión hardcodeada: action-setup la lee del campo
      # `packageManager` de package.json. El fleet mezcla pnpm 9 y 10.
      - uses: pnpm/action-setup@v4

      # setup-node va en dos variantes según el runner, y la diferencia es
      # `cache: pnpm`. En los self-hosted el store de pnpm ya vive en disco
      # local y persiste entre jobs (`pnpm store path` →
      # /home/runner/.local/share/pnpm/store/v10 en la flota del org), así
      # que cachearlo contra el servicio de GitHub sólo agrega red: medido ~2 GB
      # a 6 MB/s ≈ 5,5 min de peaje por job para traer algo que ya estaba en el
      # disco. En hosted (ubuntu-latest, sin disco persistente) sí compensa.
      #
      # Van como dos steps con `if` y no como una expresión ternaria en `cache:`
      # porque en las expresiones de Actions el string vacío es falsy, así que
      # `cond && '' || 'pnpm'` colapsa siempre a 'pnpm' — no se puede apagar el
      # caché por expresión.
      - uses: actions/setup-node@v4
        if: inputs.runner == 'gundo-local' || inputs.runner == 'jp-local'
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com

      # Fijar el store ANTES de setup-node, y no solo en el `Install` de abajo.
      #
      # `setup-node` con `cache: pnpm` resuelve la ruta a cachear al arrancar,
      # preguntando `pnpm store path`. Sin esta línea contesta la ruta derivada
      # de PNPM_HOME —que `pnpm/action-setup` planta dentro de su propio
      # directorio— mientras que el `Install` instala en `$HOME/.pnpm-store`.
      # Al terminar el job, setup-node intenta guardar la primera, que nunca
      # llegó a existir, y el post-step falla con:
      #
      #     Path Validation Error: Path(s) specified in the action for caching
      #     do(es) not exist, hence no cache is being saved.
      #
      # El lint HABÍA PASADO. Lo que se pone rojo es la limpieza posterior, así
      # que el check miente en la dirección peor: rojo con el trabajo bien
      # hecho. Y como este reusable lo usan todos los repos del ecosistema, el
      # rojo aparece en PRs de gente que no ha tocado nada de esto — que es
      # exactamente cómo se aprende a ignorar un check.
      #
      # Solo en hosted: el self-hosted no cachea (ver arriba) y ahí el store ya
      # persiste en disco.
      - name: Fijar el store de pnpm antes de que setup-node lo cachee
        if: inputs.runner != 'gundo-local' && inputs.runner != 'jp-local'
        run: pnpm config set store-dir "$HOME/.pnpm-store" --global

      - uses: actions/setup-node@v4
        if: inputs.runner != 'gundo-local' && inputs.runner != 'jp-local'
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      # Deps que NO son instalables en un checkout aislado de CI y que el lint
      # NO necesita (lintea el source propio del repo, no sus deps):
      #   - git de la org privada Gundo-Health-and-Food (GITHUB_TOKEN no clona)
      #   - `file:` / `link:` (paquetes hermanos como @gundo/ui, no existen en CI)
      # Se stripean (igual que el Dockerfile / CI de genie-api). Desincroniza el
      # lockfile a propósito → install corre con --no-frozen-lockfile.
      - name: Strip un-CI-installable deps
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));let ch=false;for(const sec of ['dependencies','devDependencies']){const o=p[sec]||{};for(const k of Object.keys(o)){const v=o[k]||'';if(/git\+https:\/\/github.com\/Gundo-Health-and-Food\//.test(v)||/^(file|link):/.test(v)){delete o[k];ch=true}}}if(ch){fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('stripped un-CI-installable deps')}"

      # --ignore-scripts: lint no necesita lifecycle scripts (build/prepare) y
      # varios repos tienen `prepare` que invoca binarios de la dep privada ya
      # stripeada (ej. `cloud-build-gen install-hooks`) → sin esto, install rompe.
      # auto-install-peers=false: no intentar instalar peerDependencies (ej.
      # `@gundo/ui: "*"` en las libs) — no hacen falta para lintear el source
      # propio y no existen en el registro público.
      # --store-dir EXPLICITO. Sin el, pnpm deriva el store de PNPM_HOME, que
      # `pnpm/action-setup` fija DENTRO de su propio directorio y rehace en cada
      # job: el store queda efimero, el install ve el lockfile completo, decide
      # que no hay nada que resolver ("resolved 0, reused 1") y luego revienta al
      # leerlo con ERR_PNPM_READ_FROM_STORE. El 17-ago eso tumbo el CI de
      # genie-api entero —main incluida— y este reusable caia igual, porque el
      # fallo no es del repo que lintea sino de donde vive el store.
      #
      # Fijandolo bajo $HOME el store persiste entre jobs, y como este workflow
      # lo usan todos los repos del ecosistema, el arreglo va aqui una sola vez.
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts --config.auto-install-peers=false --store-dir "$HOME/.pnpm-store"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los dos `if` de abajo son EXHAUSTIVOS y mutuamente excluyentes a
      # propósito: ratchet=false → full; ratchet=true + PR → incremental;
      # ratchet=true + no-PR → full. Que no vuelva a existir una combinación sin
      # step, que es exactamente como el job pasaba verde sin lintear.
      - name: Lint (full)
        if: ${{ inputs.ratchet == false || github.event_name != 'pull_request' }}
        run: pnpm exec eslint .

      - name: Lint (changed files only)
        if: ${{ inputs.ratchet == true && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            | grep -E "${{ inputs.globs }}" || true)
          if [ -z "$CHANGED" ]; then
            echo "No hay archivos lint-ables tocados por el PR."
            exit 0
          fi
          echo "Linteando archivos cambiados:"
          echo "$CHANGED"
          pnpm exec eslint $CHANGED
