# Reusable lint workflow (RATCHET) para todo el fleet GUNDO.
#
# Por qué ratchet: varios repos tienen deuda de lint preexistente (ej. genie-api
# ~172 errores en main). Un gate full nacería rojo y se ignoraría. Esto lintea
# SOLO los archivos tocados por el PR → bloquea errores NUEVOS sin exigir el
# burn-down primero. Cuando un repo termine su burn-down, cambia `ratchet: false`
# para lintear el repo entero.
#
# El ratchet es incremental POR DEFINICIÓN: mide los archivos tocados contra una
# base. En `pull_request` esa base existe y es obvia (`github.base_ref`). En un
# `push` a main no la hay — el push ya ES la nueva verdad de la rama, así que no
# hay contra qué "no empeorar". Por eso el step del ratchet nació atado a
# `pull_request`: sin ese `if` reventaba al resolver `origin/` a secas.
#
# El agujero: no existía la otra rama del `if`. Con el default `ratchet: true`,
# en push a main los DOS steps se saltaban, el job no linteaba nada y pasaba
# verde. El estado de lint de main no significaba nada en todo el fleet, y en los
# repos donde este workflow es el ÚNICO check (product-pipeline) main llevaba
# meses sin verificarse.
#
# Arreglo: el MODO lo decide el evento, no sólo el input.
#   - pull_request → ratchet incremental (si `ratchet: true`): bloquea errores
#     nuevos sin exigir el burn-down previo. Es el gate de merge.
#   - push (y cualquier otro evento) → lint COMPLETO, siempre. En una rama ya
#     mergeada lo único que se puede afirmar es el estado absoluto, que es justo
#     lo que un ratchet nunca puede decir. Es señal post-merge, no gate de merge.
#
# Uso desde un repo consumidor (.github/workflows/ci.yml):
#   jobs:
#     lint:
#       uses: jplannnou/gundo-eslint-config/.github/workflows/lint-reusable.yml@main
#       with:
#         runner: gundo-local   # `jp-local` en los privados personales;
#                               # `ubuntu-latest` en los PUBLICOS (minutos gratis)
#
# NO pongas `secrets: inherit`. Este workflow no declara bloque `secrets:` en
# su `on.workflow_call`, y el unico que usa es `secrets.GITHUB_TOKEN`, que se
# pasa solo. `inherit` mandaria TODOS los secretos del repo llamante a un
# reusable de otra cuenta referenciado por una rama movil, sin necesitar
# ninguno. Semgrep lo marca ERROR/HIGH y bloquea el gate privado.
name: Lint (reusable)

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Donde corre el lint. `gundo-local` en los repos del org, `jp-local`
          en los privados personales, o una etiqueta alojada (`ubuntu-latest`)
          en los repos PUBLICOS, donde los minutos son gratis. Sigue sin
          default a proposito: un default alojado convertia cada olvido en
          minutos de pago silenciosos, y esa parte no cambia — hay que decir
          donde se quiere correr.
        type: string
        required: true
      ratchet:
        description: >-
          Lintear sólo archivos cambiados (true) o el repo entero (false).
          SÓLO aplica en `pull_request`: fuera de un PR no hay base contra la
          que medir, así que el lint es completo pase lo que pase aquí.
        type: boolean
        default: true
      globs:
        description: >-
          Extensiones a lintear en el ratchet (regex para grep -E). Tiene que
          cubrir todo lo que los presets lintean en push: si no, un error en
          un .mjs/.cjs pasa el PR y falla después del merge. Antes del
          03-oct-2026 el default dejaba fuera mjs/cjs/mts/cts y mordió en
          cuatro repos del fleet. `pnpm test` (scripts/smoke.mjs) lo comprueba.
        type: string
        default: '\.(ts|tsx|mts|cts|js|jsx|mjs|cjs)$'
      node-version:
        type: string
        default: "22"

permissions:
  contents: read
  packages: read

jobs:
  lint:
    # Una etiqueta `ubuntu-*` va sola; cualquier otra se combina con
    # `self-hosted`, exactamente como antes.
    #
    # Antes esto era `[self-hosted, "${{ inputs.runner }}"]` fijo, y eso dejaba
    # a los repos PUBLICOS sin salida: `gundo-ui` y `gundo-feedback-sdk` no
    # tienen runner propio —los `gundo-local` estan registrados en el org, y un
    # repo de cuenta personal no los alcanza— asi que cualquier valor producia
    # un job encolado para siempre. Como ademas `runner` es requerido, sus PRs
    # arrancaban en `startup_failure` desde el 2-sep. En un repo publico los
    # minutos alojados son gratis, con lo que el motivo de exigir self-hosted
    # ahi no existe.
    # El `fromJSON` va FUERA de las ramas a proposito. Con el dentro
    # —`cond && fromJSON(a) || fromJSON(b)`— las ramas devuelven arrays, y en
    # las expresiones de GitHub un array se convierte a NaN en contexto
    # booleano, o sea FALSY: el `||` gana siempre y salia
    # `[self-hosted, ubuntu-latest]`, que no existe. Medido en el primer
    # intento: `labels=self-hosted,ubuntu-latest`, job encolado sin fin.
    # Ramificando sobre CADENAS el operador se comporta, y `fromJSON` envuelve
    # el resultado ya elegido.
    runs-on: >-
      ${{ fromJSON(startsWith(inputs.runner, 'ubuntu-')
          && format('["{0}"]', inputs.runner)
          || format('["self-hosted","{0}"]', inputs.runner)) }}
    steps:
      # Checkout superficial; la historia que el ratchet necesita la trae el
      # step "Traer la rama base" justo antes de lintear. Antes era
      # `fetch-depth: 0`, que descarga TODAS las ramas y tags del repo: lento
      # en repos con cientos de ramas, y roto en macOS (APFS no distingue
      # mayúsculas): ecom tiene `Staging` y `staging`, el fetch revienta y el
      # job muere en el checkout (piloto gundo-light, 14-oct-2026).
      - uses: actions/checkout@v4

      # pnpm sin versión hardcodeada: action-setup la lee del campo
      # `packageManager` de package.json. El fleet mezcla pnpm 9 y 10.
      - uses: pnpm/action-setup@v4

      # setup-node va en dos variantes según el runner, y la diferencia es
      # `cache: pnpm`. En los self-hosted el store de pnpm ya vive en disco
      # local y persiste entre jobs (`pnpm store path` →
      # /home/runner/.local/share/pnpm/store/v10 en la flota del org), así
      # que cachearlo contra el servicio de GitHub sólo agrega red: medido ~2 GB
      # a 6 MB/s ≈ 5,5 min de peaje por job para traer algo que ya estaba en el
      # disco. En hosted (ubuntu-latest, sin disco persistente) sí compensa.
      #
      # Van como dos steps con `if` y no como una expresión ternaria en `cache:`
      # porque en las expresiones de Actions el string vacío es falsy, así que
      # `cond && '' || 'pnpm'` colapsa siempre a 'pnpm' — no se puede apagar el
      # caché por expresión.
      #
      # Self-hosted es "todo lo que no sea `ubuntu-*`", el mismo criterio que
      # `runs-on`. Antes era una lista fija (`gundo-local`/`jp-local`) y
      # cualquier carril nuevo (`gundo-light` con el Mac, `gundo-main`) caía en
      # la rama hosted: bajaba ~2 GB de caché pnpm por job a un runner que ya
      # tiene el store en disco. `scripts/smoke.mjs` impide volver a la lista.
      - uses: actions/setup-node@v4
        if: ${{ !startsWith(inputs.runner, 'ubuntu-') }}
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com

      # Fijar el store ANTES de setup-node, y no solo en el `Install` de abajo.
      #
      # `setup-node` con `cache: pnpm` resuelve la ruta a cachear al arrancar,
      # preguntando `pnpm store path`. Sin esta línea contesta la ruta derivada
      # de PNPM_HOME —que `pnpm/action-setup` planta dentro de su propio
      # directorio— mientras que el `Install` instala en `$HOME/.pnpm-store`.
      # Al terminar el job, setup-node intenta guardar la primera, que nunca
      # llegó a existir, y el post-step falla con:
      #
      #     Path Validation Error: Path(s) specified in the action for caching
      #     do(es) not exist, hence no cache is being saved.
      #
      # El lint HABÍA PASADO. Lo que se pone rojo es la limpieza posterior, así
      # que el check miente en la dirección peor: rojo con el trabajo bien
      # hecho. Y como este reusable lo usan todos los repos del ecosistema, el
      # rojo aparece en PRs de gente que no ha tocado nada de esto — que es
      # exactamente cómo se aprende a ignorar un check.
      #
      # Solo en hosted: el self-hosted no cachea (ver arriba) y ahí el store ya
      # persiste en disco.
      - name: Fijar el store de pnpm antes de que setup-node lo cachee
        if: ${{ startsWith(inputs.runner, 'ubuntu-') }}
        run: pnpm config set store-dir "$HOME/.pnpm-store" --global

      - uses: actions/setup-node@v4
        if: ${{ startsWith(inputs.runner, 'ubuntu-') }}
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      # Deps que NO son instalables en un checkout aislado de CI y que el lint
      # NO necesita (lintea el source propio del repo, no sus deps):
      #   - git de la org privada Gundo-Health-and-Food (GITHUB_TOKEN no clona)
      #   - `file:` / `link:` (paquetes hermanos como @gundo/ui, no existen en CI)
      # Se stripean (igual que el Dockerfile / CI de genie-api). Desincroniza el
      # lockfile a propósito → install corre con --no-frozen-lockfile.
      - name: Strip un-CI-installable deps
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));let ch=false;for(const sec of ['dependencies','devDependencies']){const o=p[sec]||{};for(const k of Object.keys(o)){const v=o[k]||'';if(/git\+https:\/\/github.com\/Gundo-Health-and-Food\//.test(v)||/^(file|link):/.test(v)){delete o[k];ch=true}}}if(ch){fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');console.log('stripped un-CI-installable deps')}"

      # --ignore-scripts: lint no necesita lifecycle scripts (build/prepare) y
      # varios repos tienen `prepare` que invoca binarios de la dep privada ya
      # stripeada (ej. `cloud-build-gen install-hooks`) → sin esto, install rompe.
      # auto-install-peers=false: no intentar instalar peerDependencies (ej.
      # `@gundo/ui: "*"` en las libs) — no hacen falta para lintear el source
      # propio y no existen en el registro público.
      # --store-dir EXPLICITO. Sin el, pnpm deriva el store de PNPM_HOME, que
      # `pnpm/action-setup` fija DENTRO de su propio directorio y rehace en cada
      # job: el store queda efimero, el install ve el lockfile completo, decide
      # que no hay nada que resolver ("resolved 0, reused 1") y luego revienta al
      # leerlo con ERR_PNPM_READ_FROM_STORE. El 17-ago eso tumbo el CI de
      # genie-api entero —main incluida— y este reusable caia igual, porque el
      # fallo no es del repo que lintea sino de donde vive el store.
      #
      # Fijandolo bajo $HOME el store persiste entre jobs, y como este workflow
      # lo usan todos los repos del ecosistema, el arreglo va aqui una sola vez.
      - name: Install
        run: pnpm install --no-frozen-lockfile --ignore-scripts --config.auto-install-peers=false --store-dir "$HOME/.pnpm-store"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Los dos `if` de abajo son EXHAUSTIVOS y mutuamente excluyentes a
      # propósito: ratchet=false → full; ratchet=true + PR → incremental;
      # ratchet=true + no-PR → full. Que no vuelva a existir una combinación sin
      # step, que es exactamente como el job pasaba verde sin lintear.
      - name: Lint (full)
        if: ${{ inputs.ratchet == false || github.event_name != 'pull_request' }}
        run: pnpm exec eslint .

      # Solo la rama base, con historia completa para que `base...HEAD`
      # encuentre el merge-base. `--unshallow` solo si el repo sigue superficial:
      # en self-hosted el directorio de trabajo se reutiliza y puede venir
      # completo de un job anterior, y ahí git rechaza `--unshallow`. Cinco
      # minutos cubren esta única rama y evitan retener el runner si Git se cuelga.
      - name: Traer la rama base
        if: ${{ inputs.ratchet == true && github.event_name == 'pull_request' }}
        timeout-minutes: 5
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if ! git check-ref-format --branch "$BASE_REF" >/dev/null 2>&1; then
            echo "::error::La rama base recibida no es una referencia Git válida."
            exit 2
          fi

          # La salida de Git puede incluir credenciales en una URL. Se usa sólo
          # para clasificar el fallo y se elimina siempre, sin imprimirla.
          umask 077
          FETCH_ERROR=$(mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/gundo-lint-fetch.XXXXXX")
          trap 'rm -f "$FETCH_ERROR"' EXIT

          is_retryable_transport_failure() {
            grep -Eiq -- \
              'Could not resolve host|Failed to connect to .* port [0-9]+|Connection (timed out|reset( by peer)?)|Operation timed out|Recv failure|Send failure|Empty reply from server|RPC failed; curl (7|18|28|52|55|56|92)|HTTP/[0-9.]+ stream [0-9]+ was not closed cleanly|early EOF|remote end hung up unexpectedly' \
              "$1"
          }

          is_permanent_fetch_failure() {
            grep -Eiq -- \
              'Authentication failed|Invalid username or password|could not read (Username|Password)|Permission denied|The requested URL returned error: (401|403)|Repository not found|couldn.t find remote ref|remote ref does not exist|SSL certificate problem|certificate verify failed|unable to get local issuer certificate|SEC_E_UNTRUSTED_ROOT|server certificate verification failed|TLS: failed to verify certificate' \
              "$1"
          }

          FETCH_STATUS=1
          for ATTEMPT in 1 2 3; do
            UNSHALLOW=()
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              UNSHALLOW=(--unshallow)
            fi

            : > "$FETCH_ERROR"
            set +e
            LC_ALL=C git fetch --no-tags "${UNSHALLOW[@]}" origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" >"$FETCH_ERROR" 2>&1
            FETCH_STATUS=$?
            set -e

            if [ "$FETCH_STATUS" -eq 0 ]; then
              break
            fi
            if is_permanent_fetch_failure "$FETCH_ERROR" || \
              ! is_retryable_transport_failure "$FETCH_ERROR"; then
              echo "::error::No se pudo traer la rama base por un fallo no reintentable."
              exit "$FETCH_STATUS"
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              echo "::error::No se pudo traer la rama base tras 3 fallos transitorios de red."
              exit "$FETCH_STATUS"
            fi
            echo "::warning::Fallo transitorio al traer la rama base; reintento $((ATTEMPT + 1)) de 3."
            sleep "$ATTEMPT"
          done

          REMOTE_BASE="refs/remotes/origin/${BASE_REF}"
          if ! git rev-parse --verify --quiet "${REMOTE_BASE}^{commit}" >/dev/null; then
            echo "::error::El fetch terminó sin crear la referencia remota esperada."
            exit 1
          fi
          if ! git merge-base "$REMOTE_BASE" HEAD >/dev/null; then
            echo "::error::La rama base y HEAD no tienen un ancestro común verificable."
            exit 1
          fi

      - name: Lint (changed files only)
        if: ${{ inputs.ratchet == true && github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" \
            | grep -E "${{ inputs.globs }}" || true)
          if [ -z "$CHANGED" ]; then
            echo "No hay archivos lint-ables tocados por el PR."
            exit 0
          fi
          echo "Linteando archivos cambiados:"
          echo "$CHANGED"
          pnpm exec eslint $CHANGED
